services:
  antivirus:
    image: clamav/clamav:stable
    volumes:
      - antivirus-db:/var/lib/clamav
    environment:
      CLAMD_CONF_StreamMaxLength: 30M
      CLAMD_CONF_MaxFileSize: 30M
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    restart: unless-stopped
  api:
    image: saher-backend:local
    depends_on:
      antivirus:
        condition: service_healthy
    build:
      context: .
      target: backend
    environment:
      SAHER_ENABLE_BACKGROUND_WORKER: "false"
      SAHER_CLAMD_HOST: antivirus
      SAHER_PRIVACY_MODELS: /opt/saher-models/privacy
      SAHER_ALLOWED_ORIGINS: http://localhost:8730,http://127.0.0.1:8730
    volumes:
      - archive:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8765/health'))['status'] == 'healthy'"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8730:80"
    restart: unless-stopped
volumes:
  archive:
  antivirus-db:
